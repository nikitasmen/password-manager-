# Pushing a v* tag runs every test suite (test.yml), then builds both apps from that tag and publishes them as the
# GitHub release the updaters read. Nothing is built, published or deployed unless all the tests pass.
# Asset names are part of the updater contract: `password_manager` (AppUpdater::getPlatformBinaryName) and an `.apk`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  desktop:
    needs: tests
    # Built outside nix so it runs on ordinary distros; 22.04 keeps the glibc floor at 2.34.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libfltk1.3-dev libfontconfig-dev libssl-dev libcurl4-openssl-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPWVAULT_VERSION=${{ github.ref_name }}
      - run: cmake --build build -j
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: build/password_manager }

  android:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # versionName comes from `git describe --tags`
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.4' }
      - name: Release key
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          # An unsigned or differently signed APK can't update installed copies, so never publish one.
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: gradle assembleRelease  # tested in test.yml
        env:
          ORG_GRADLE_PROJECT_pwvaultKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_pwvaultKeystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_pwvaultKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_pwvaultKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: android, path: android/build/outputs/apk/release/pwvault-release.apk }

  firmware:
    needs: tests
    runs-on: ubuntu-latest
    env:
      CORE: esp32:esp32@3.3.12  # the same pins as shell.nix
      CORE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls "$CORE_URL"
          arduino-cli core install "$CORE" --additional-urls "$CORE_URL"
          arduino-cli lib install "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3"
      # No cert.h or secrets.h here: a generic build makes its server cert on first boot and asks for Wi-Fi itself.
      - run: arduino-cli compile -b esp32:esp32:esp32 --export-binaries --output-dir out esp32/vault
      - name: Flasher site
        env: { TAG: '${{ github.ref_name }}' }
        run: |
          # The parts, never vault.ino.merged.bin: that's a full 4 MB image and would wipe the vault (LittleFS) and
          # the saved Wi-Fi (NVS). Offsets are those of the default partition table.
          mkdir site
          cp esp32/flash/index.html site/
          cp out/vault.ino.bootloader.bin site/bootloader.bin
          cp out/vault.ino.partitions.bin site/partitions.bin
          cp ~/.arduino15/packages/esp32/hardware/esp32/${CORE##*@}/tools/partitions/boot_app0.bin site/
          cp out/vault.ino.bin site/firmware.bin
          cat > site/manifest.json <<EOF
          {
            "name": "pwvault board",
            "version": "$TAG",
            "new_install_prompt_erase": false,
            "builds": [{
              "chipFamily": "ESP32",
              "parts": [
                { "path": "bootloader.bin", "offset": 4096 },
                { "path": "partitions.bin", "offset": 32768 },
                { "path": "boot_app0.bin", "offset": 57344 },
                { "path": "firmware.bin", "offset": 65536 }
              ]
            }]
          }
          EOF
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  pages:
    needs: firmware
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ github.ref_name }}' }
        run: |
          # Keep a release drafted by hand (its notes); otherwise create one.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber password_manager pwvault-release.apk
